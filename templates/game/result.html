<section id="resultScreen"
    class="hidden min-h-screen max-w-3xl mx-auto px-6 py-16 bg-white">

    <div class="text-center mb-12">

        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-50 text-green-600 text-3xl mb-5">
            ✓
        </div>

        <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-neutral-900">
            Test Completed!
        </h1>

        <p class="text-neutral-400 mt-3 text-sm">
            Great effort. Here's your typing performance.
        </p>

    </div>

    <div class="grid grid-cols-2 gap-4">

        <div class="bg-neutral-50 border border-neutral-100 rounded-2xl p-6">
            <p class="text-xs text-neutral-400 uppercase tracking-widest">
                Words Per Minute
            </p>
            <h2 id="resultWpm" class="text-4xl md:text-5xl font-bold mt-4 text-neutral-900">0</h2>
        </div>

        <div class="bg-neutral-50 border border-neutral-100 rounded-2xl p-6">
            <p class="text-xs text-neutral-400 uppercase tracking-widest">
                Accuracy
            </p>
            <h2 id="resultAccuracy" class="text-4xl md:text-5xl font-bold mt-4 text-neutral-900">100%</h2>
        </div>

        <div class="bg-neutral-50 border border-neutral-100 rounded-2xl p-6">
            <p class="text-xs text-neutral-400 uppercase tracking-widest">
                Correct Characters
            </p>
            <h2 id="resultCorrect" class="text-3xl md:text-4xl font-bold mt-4 text-neutral-900">0</h2>
        </div>

        <div class="bg-neutral-50 border border-neutral-100 rounded-2xl p-6">
            <p class="text-xs text-neutral-400 uppercase tracking-widest">
                Total Mistakes
            </p>
            <h2 id="resultMistakes" class="text-3xl md:text-4xl font-bold mt-4 text-red-500">0</h2>
        </div>

    </div>

    <div class="mt-12">

        <label for="retestDuration" class="block text-sm font-semibold text-neutral-700 mb-3">
            Choose your retest duration
        </label>

        <select id="retestDuration"
            class="w-full bg-white border border-neutral-200 rounded-xl px-4 py-4 text-sm outline-none cursor-pointer">

            <option value="15">15 Seconds</option>
            <option value="30">30 Seconds</option>
            <option value="60" selected>60 Seconds</option>
            <option value="120">120 Seconds</option>

        </select>

        <button id="retestButton"
            class="w-full mt-5 bg-neutral-900 text-white rounded-xl py-4 font-semibold text-sm hover:bg-neutral-700 transition">
            Retest →
        </button>

        <button id="homeButton"
            class="w-full mt-3 border border-neutral-200 text-neutral-700 rounded-xl py-4 font-semibold text-sm hover:bg-neutral-50 transition">
            Back to Home
        </button>

    </div>

    <p class="text-center text-xs text-neutral-300 mt-12">
        TypeMaster · Keep practising. Keep improving.
    </p>

</section>
