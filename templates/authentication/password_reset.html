{% extends "base.html" %}

{% block title %}Forgot Password | TypeMaster Pro{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center px-5 bg-neutral-50">

    <div class="w-full max-w-md bg-white border rounded-2xl p-8 shadow-sm">

        <h1 class="text-2xl font-bold text-center">Forgot Password?</h1>

        <p class="text-sm text-neutral-500 text-center mt-3 mb-7">
            Enter your registered email to receive a password reset link.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.email }}

            <button type="submit"
                class="w-full mt-6 bg-neutral-900 text-white py-3 rounded-xl font-semibold">
                Send Reset Link
            </button>
        </form>

        <p class="text-center text-sm mt-6">
            <a href="{% url 'login' %}" class="text-purple-600">
                Back to Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
