{% extends "base/base.html" %}
{% block title %}Email Sent | TypeMaster Pro{% endblock %}
{% block content %}
    <div class="min-h-screen flex items-center justify-center bg-neutral-50 px-5">
        <div class="max-w-md bg-white border rounded-2xl p-8 text-center shadow-sm">
            <h1 class="text-2xl font-bold">Check Your Email</h1>
            <p class="text-neutral-500 mt-4">
                If an account exists with that email, we have sent a password reset link.
            </p>
            <a href="{% url 'login' %}"
               class="inline-block mt-6 text-purple-600 font-semibold">Back to Login</a>
        </div>
    </div>
{% endblock %}
