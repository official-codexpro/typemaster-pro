
{% extends "base.html" %}

{% block title %}Password Updated | TypeMaster Pro{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center px-5 bg-neutral-50">

    <div class="w-full max-w-md bg-white border border-neutral-200 rounded-2xl p-8 text-center shadow-sm">

        <div class="w-16 h-16 mx-auto rounded-full bg-green-100 text-green-700 flex items-center justify-center text-3xl">
            ✓
        </div>

        <h1 class="text-2xl font-bold mt-5">
            Password Changed!
        </h1>

        <p class="text-sm text-neutral-500 mt-3">
            Your password has been successfully updated.
        </p>

        <a href="{% url 'profile' %}"
           class="inline-block mt-7 bg-neutral-900 hover:bg-neutral-700 text-white px-7 py-3 rounded-xl font-semibold">
            Back to Profile
        </a>

    </div>

</div>

{% endblock %}
