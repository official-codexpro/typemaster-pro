
{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TypeMaster Pro{% endblock %}</title>

    <!-- Load saved theme before page renders -->
    <script>
        (() => {
            const savedTheme = localStorage.getItem('typemaster-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body class="min-h-screen">

    <!-- Navbar -->
    {% include "components/navbar.html" %}

    <!-- Page Content -->
    {% block content %}{% endblock %}

    <!-- Footer -->
    {% include "components/footer.html" %}

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.2/gsap.min.js"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
